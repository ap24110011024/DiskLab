<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History – DiskLab</title>
  <meta name="description" content="DiskLab: interactive SSTF, SCAN and LOOK disk scheduling visualizer.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/analytics.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main" id="main">

      <header class="page-head row between"><div><h1>Simulation History</h1>
        <p>Saved in this browser with LocalStorage, so it survives a refresh. <span class="faint" id="history-count"></span></p></div>
        <button class="btn btn-danger" id="clear-history">Clear history</button></header>
      <div id="history-error"></div>
      <div id="history-list"></div>
      <footer class="footer">
        <div><b>DiskLab</b> · Disk Scheduling Algorithm Visualizer · Operating Systems project</div>
        <div>SSTF · SCAN · LOOK · head movement is measured in cylinders, not milliseconds · runs entirely in the browser</div>
      </footer>
    </main>
  </div>
  <script type="module" src="../js/pages/history.js"></script>
</body>
</html>
